<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Chronos</title>
  <link rel="icon" href="/static/chronos.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/static/base.css">
  <link rel="stylesheet" href="/static/style.css">
  <script src="/static/ui.js" defer></script>
  <script src="/static/app.js" defer></script>
</head>
<body>
  <header class="top">
    <div class="brand">
      <img src="/static/chronos.svg" alt="" width="28" height="28">
      <span class="brand__name">Chronos</span>
      <span class="brand__tag">commit diary</span>
      <span id="demo" class="badge badge--warn" hidden>demo data</span>
    </div>
    <div class="actions">
      <select id="days" aria-label="Period">
        <option value="30">30 days</option><option value="90">90 days</option>
        <option value="182">6 months</option><option value="365" selected>1 year</option>
      </select>
      <span id="updated" class="note"></span>
      <button id="refresh" class="btn btn--small" type="button">Refresh</button>
    </div>
  </header>

  <main class="page">
    <p id="error" class="error" hidden></p>
    <section class="stats" id="stats" aria-label="Summary"></section>

    <section class="panel">
      <div class="panel__head">
        <h2 class="panel__title" id="heat-title">Commits per day</h2>
        <div class="legend" aria-hidden="true">less <i class="l0"></i><i class="l1"></i><i class="l2"></i><i class="l3"></i><i class="l4"></i> more</div>
      </div>
      <div class="scroll"><div id="heatmap" class="heat" role="img"></div></div>
    </section>

    <section class="grid">
      <div class="panel">
        <h2 class="panel__title">Commits by hour</h2>
        <div id="hours" class="bars" role="img"></div>
        <div class="axis"><span>00</span><span>06</span><span>12</span><span>18</span><span>23</span></div>
      </div>
      <div class="panel">
        <h2 class="panel__title">Commits by weekday</h2>
        <div id="weekdays" class="bars bars--week" role="img"></div>
        <div class="axis axis--week"><span>Mon</span><span>Tue</span><span>Wed</span><span>Thu</span><span>Fri</span><span>Sat</span><span>Sun</span></div>
      </div>
    </section>

    <section class="panel">
      <div class="panel__head">
        <h2 class="panel__title">Projects</h2>
        <input type="text" id="filter" class="filter" placeholder="filter" aria-label="Filter projects">
      </div>
      <div class="scroll">
        <table class="table repos">
          <thead><tr><th>Project</th><th class="num">Commits</th><th class="share"></th><th class="num">Days</th><th class="num">Lines</th><th>Last commit</th></tr></thead>
          <tbody id="repos"></tbody>
        </table>
      </div>
    </section>

    <section class="panel">
      <h2 class="panel__title">Latest commits</h2>
      <ul id="recent" class="recent"></ul>
    </section>
  </main>
  <div id="tip" class="tip" role="tooltip" hidden></div>
</body>
</html>
