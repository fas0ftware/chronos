name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -r requirements-dev.txt
      - run: python -m pyflakes chronos tests
      - run: python -m pytest -q
      - name: Demo smoke test
        run: |
          python -m chronos --demo summary
          python -m chronos --demo json | python -c "import json,sys; s=json.load(sys.stdin); assert s['totals']['commits'] > 300"
          python -m chronos --demo svg | head -c 4 | grep -q '<svg'

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: pip install bandit
      - name: Static analysis (bandit)
        run: bandit -q -r chronos
